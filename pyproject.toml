[project]
name = "unreliable-assistant"
version = "0.1.0"
description = "Enterprise-grade MCP-based agentic RAG assistant (hackathon mid-check)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "mcp>=1.2,<2",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "streamlit>=1.37",
    "graphviz>=0.20",
    "httpx>=0.27",
    "nltk>=3.10.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]  # line length handled by the formatter; long regexes are intentional
